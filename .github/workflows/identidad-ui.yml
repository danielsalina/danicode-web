name: identidad-ui
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # FALLA EL PR SI ALGUN ARCHIVO ROMPE LA IDENTIDAD UI
      - run: node scripts/check-identidad.mjs
